<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PokéForest</title>
  <meta name="description" content="Fokus-Training mit deinem Pokémon-Team – die Web-Version von PokéForest für iPhone und iPad.">
  <meta name="theme-color" content="#1F5E3B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PokéForest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="trainer">
        <span class="app-name">PokéForest</span>
        <span id="coins" class="coins" aria-label="PokéMünzen"></span>
      </div>
      <div class="top-right"><div id="goal" class="goal" role="img" aria-label="Tagesziel"></div><div id="sync-dot" class="sync-dot" role="status"></div></div>
    </header>
    <main id="view" class="view"></main>
    <nav class="tabbar" aria-label="Bereiche">
      <button data-action="tab" data-view="train" aria-selected="true"><span class="tab-icon" aria-hidden="true">◎</span>Training</button>
      <button data-action="tab" data-view="safari" aria-selected="false"><span class="tab-icon" aria-hidden="true">✿</span>Safari</button>
      <button data-action="tab" data-view="trainer" aria-selected="false"><span class="tab-icon" aria-hidden="true">★</span>Trainer</button>
      <button data-action="tab" data-view="shop" aria-selected="false"><span class="tab-icon" aria-hidden="true">◈</span>Shop</button>
      <button data-action="tab" data-view="more" aria-selected="false"><span class="tab-icon" aria-hidden="true">≡</span>Mehr</button>
    </nav>
  </div>

  <dialog id="sheet" class="sheet"></dialog>
  <dialog id="evolution" class="evolution"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
